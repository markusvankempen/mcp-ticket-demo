<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" fill="#0d7a63"/>

  <!-- Subtle inner glow layer -->
  <rect width="128" height="128" rx="22" fill="url(#bg-grad)"/>

  <!-- Ticket body -->
  <rect x="18" y="38" width="92" height="52" rx="8" fill="#075346"/>
  <!-- Ticket perforation notches -->
  <circle cx="18" cy="64" r="7" fill="#0d7a63"/>
  <circle cx="110" cy="64" r="7" fill="#0d7a63"/>
  <!-- Ticket dashed centre line -->
  <line x1="25" y1="64" x2="103" y2="64" stroke="#0d7a63" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- Top half: three text lines suggesting a ticket subject -->
  <rect x="30" y="46" width="50" height="5" rx="2.5" fill="#c7e86b" opacity="0.9"/>
  <rect x="30" y="55" width="36" height="4" rx="2" fill="#c7e86b" opacity="0.45"/>

  <!-- Bottom half: tool-call "plug" icon -->
  <!-- Left pin -->
  <rect x="48" y="68" width="6" height="11" rx="2" fill="#c7e86b"/>
  <!-- Right pin -->
  <rect x="62" y="68" width="6" height="11" rx="2" fill="#c7e86b"/>
  <!-- Connector body -->
  <rect x="44" y="76" width="28" height="8" rx="3" fill="#c7e86b"/>

  <!-- MCP arc / signal lines top-right -->
  <path d="M88 50 Q96 56 88 62" stroke="#c7e86b" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.7"/>
  <path d="M93 46 Q104 56 93 66" stroke="#c7e86b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.45"/>

  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12a882" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.12"/>
    </linearGradient>
  </defs>
</svg>
