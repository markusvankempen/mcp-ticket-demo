name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          experimental: true

      - name: Install server dependencies
        run: mise run install

      - name: Run smoke test
        run: mise run test

      - name: Package extension
        run: mise run ext-package

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v4
        with:
          name: summit-mcp-platform-${{ github.sha }}
          path: extension/*.vsix
          retention-days: 14
