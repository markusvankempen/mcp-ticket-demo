# Native Node on Render — not the UBI Dockerfile (registry.redhat.io needs a login).
# Deploy from the extension or: https://render.com/deploy?repo=https://github.com/markusvankempen/mcp-ticket-demo
services:
  - type: web
    name: mcp-ticket-demo
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install --omit=dev
    startCommand: node src/index.js
    healthCheckPath: /health
    envVars:
      - key: MCP_MODE
        value: http
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: write
      - key: ADMIN_PASSWORD
        generateValue: true
