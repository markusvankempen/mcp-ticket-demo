# Installs the published npm package. This repo does not contain server/src.
# Deploy: https://render.com/deploy?repo=https://github.com/markusvankempen/mcp-ticket-demo
services:
  - type: web
    name: mcp-ticket-demo
    runtime: node
    plan: free
    buildCommand: npm init -y && npm install mcp-ticket-demo@3.0.1
    startCommand: npx --no-install mcp-ticket-demo
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: MCP_MODE
        value: http
      - key: HOST
        value: 0.0.0.0
      - key: AUTH_MODE
        value: write
